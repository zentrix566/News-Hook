name: 每日新闻推送

# 每天北京时间 9 点执行
# 注意：GitHub Actions 的 cron 使用 UTC 时间，北京时间 9 点 = UTC 1 点
on:
  schedule:
    - cron: '0 1 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news fetch and push
        env:
          FEISHU_INFORMATION_WEBHOOK: ${{ secrets.FEISHU_INFORMATION_WEBHOOK }}
        run: python main.py
